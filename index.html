<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Force redirect to the Laravel application
        window.location.href = '/public/';
    </script>
</head>
<body>
    <p>Redirecting to Laravel application...</p>
    <script>
        // Fallback redirect
        setTimeout(function() {
            window.location.href = '/public/';
        }, 1000);
    </script>
</body>
</html>
